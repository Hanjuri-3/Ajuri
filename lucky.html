<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajuri - You've Been Lucky</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  
  <style>
    :root {
      --bg: hotpink;
      --accent: #ff8cc4;
      --text: #111;
      --muted: #333;
      --container-max: 900px;
      --space-xxs: 0.25rem;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --radius: 8px;
    }
    
    * , *::before , *::after { box-sizing: border-box; }
    
    html , body {
      height: 100%;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-md);
      width: 100%;
    }

    /* Navigation */
    .topnav {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      background: #333;
      padding: 0.5rem;
      flex-wrap: wrap;
    }
    
    .topnav a {
      color: #f2f2f2;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .topnav a:hover {
      background: #ddd;
      color: #000;
    }
    
    .topnav a.active {
      background: var(--accent);
      color: #fff;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-lg);
      text-align: center;
    }
    
    .hero img {
      width: 100%;
      max-width: 400px;
      height: auto;
      display: block;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }

    /* Headings & Text */
    h1 {
      margin: 1.5rem 0 1rem 0;
      color: pink;
      font-size: 2rem;
    }
    
    h2 {
      color: pink;
      font-size: 1.75rem;
      margin: 1.5rem 0 1rem 0;
    }
    
    p {
      margin: 0.6rem 0;
      text-align: center;
      font-size: 1rem;
    }

    a {
      color: #000;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    a:hover {
      color: #fff;
    }

    /* Carousel */
    .carousel-inner {
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }
    
    .carousel-control {
      background: rgba(0, 0, 0, 0.3);
      border: none;
      width: auto;
      padding: 0 15px;
    }
    
    .carousel-control:hover {
      background: rgba(0, 0, 0, 0.5);
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: var(--space-sm) var(--space-md);
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .social a {
      color: #fff;
      font-size: 1.4rem;
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    
    .social a:hover {
      transform: scale(1.2);
    }

    /* Responsive Design */
    @media (min-width: 480px) {
      h1 {
        font-size: 2.25rem;
      }
      
      h2 {
        font-size: 2rem;
      }
      
      p {
        font-size: 1.1rem;
      }
    }

    @media (min-width: 768px) {
      .container {
        padding: var(--space-lg);
      }
      
      .topnav {
        justify-content: flex-start;
        padding: 0.5rem var(--space-md);
      }
      
      h1 {
        font-size: 2.5rem;
      }
      
      h2 {
        font-size: 2.25rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="topnav" aria-label="Main navigation">
    <a class="active" href="lucky.html">Artwork</a>
    <a href="index.html">Home</a>
    <a href="index.html">Contact</a>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <h1>Artwork</h1>
    <h2>You've Been Lucky...</h2>
    
    <!-- Carousel -->
    <div id="myCarousel" class="carousel slide" data-ride="carousel">
      <!-- Indicators -->
      <ol class="carousel-indicators">
        <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#myCarousel" data-slide-to="1"></li>
      </ol>

      <!-- Wrapper for slides -->
      <div class="carousel-inner" role="listbox">
        <div class="item active">
          <img src="IMG_5770.jpeg" alt="You've Been Lucky artwork slide 1" style="width: 100%; height: auto;">
        </div> 
        <div class="item">
          <img src="IMG_5639.jpeg" alt="You've Been Lucky artwork slide 2" style="width: 100%; height: auto;">
        </div>
      </div>

      <!-- Left and right controls -->
      <a class="left carousel-control" href="#myCarousel" data-slide="prev" role="button">
        <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="right carousel-control" href="#myCarousel" data-slide="next" role="button">
        <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>

    <!-- Artwork Details -->
    <p><strong>"You've Been Lucky, They Could Have Been Smaller" / Women Talking</strong></p>
    <p>2026</p>
    <p>Acrylic and Oil Stick on Canvas</p>
    <p>39×28"</p>
  </div>

  <!-- Footer -->
  <footer>
    <div class="social">
      <!-- Add social media links here -->
      <a href="#" title="Instagram">📱</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
