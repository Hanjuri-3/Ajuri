<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artwork</title>

  <style>
    :root{
      --bg: white;
      --accent: #ff8cc4;
      --text: #111;
      --muted: #333;
      --container-max: 900px;
      --space-xxs: 0.25rem;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --radius: 8px;
    }
    
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing:antialiased;
      background:var(--bg);
      color:var(--text);
      line-height:1.5;
    }

    .container{
      max-width:var(--container-max);
      margin: 0 auto;
      padding: var(--space-lg) var(--space-md);
      width:100%;
    }

    .topnav{
      display:flex;
      gap: .5rem;
      justify-content:center;
      background:#333;
      padding: .25rem .5rem;
      flex-wrap: wrap;
    }
    .topnav a{
      color:#f2f2f2;
      text-decoration:none;
      padding: .6rem 1rem;
      border-radius:6px;
      font-size:1rem;
    }
    .topnav a:hover{ background:#ddd; color:#000; }
    .topnav a.active{ background:var(--accent); color:#fff; }

    h1{
      margin: var(--space-md) 0 var(--space-sm) 0;
      color:pink;
      font-size:2rem;
      text-align:center;
    }

    .gallery{
      display:grid;
      grid-template-columns: 1fr;
      gap: var(--space-lg);
      margin: var(--space-lg) 0;
    }

    .gallery-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    .gallery-item a{
      display:block;
      margin-bottom: var(--space-md);
    }

    .gallery-item img{
      width:100%;
      max-width:300px;
      height:auto;
      display:block;
      border-radius:6px;
      box-shadow:0 6px 18px rgba(0,0,0,0.15);
    }

    .gallery-item p{
      margin: .6rem 0;
      color: var(--text);
    }

    a { color: #000; text-decoration:none; }
    a:hover { color:var(--accent); }

    footer{
      margin-top:auto;
      padding: var(--space-sm) var(--space-md);
      display:flex;
      justify-content:center;
      gap:1rem;
    }
    .social a{ color:#fff; font-size:1.4rem; text-decoration:none; }

    @media (min-width:600px){
      .gallery{
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-lg);
      }
      
      h1{
        text-align:left;
      }
      
      .gallery-item{
        text-align:left;
      }
    }

    @media (min-width:760px){
      .topnav{ 
        justify-content:flex-start; 
        padding: .5rem var(--space-md); 
      }
      .container{ 
        padding: var(--space-lg); 
      }
    }
  </style>
</head>
<body>
  <nav class="topnav" aria-label="Main navigation">
    <a class="active" href="artwork.html">Artwork</a>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <h1>Artwork</h1>
    
    <div class="gallery">
      <div class="gallery-item">
        <a href="lucky.html">
          <img src="IMG_5770.jpeg" alt="Women Talking" />
        </a>
        <p>"You've Been Lucky, They Could Have Been Smaller" / Women Talking</p>
      </div>

      <div class="gallery-item">
        <a href="mantis.html">
          <img src="IMG_5814.jpeg" alt="Mantis" />
        </a>
        <p>Study of a Preying Mantis' Existential Crisis In a Crooked Bathroom</p>
      </div>

      <div class="gallery-item">
        <a href="sausages.html">
          <img src="IMG_5833.jpeg" alt="Sausage" />
        </a>
        <p>"How Do You Feel About Making Sausages?" / Source of Income</p>
      </div>

      <div class="gallery-item">
        <a href="whine.html">
          <img src="IMG_5727.jpeg" alt="Whine" />
        </a>
        <p>Getting Under to Get Over / Whine</p>
      </div>
    </div>
  </div>
</body>
</html>
